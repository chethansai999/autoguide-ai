services:
  - type: web
    name: autoguide-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_BACKEND
        value: hashing
      - key: RERANKER_BACKEND
        value: none
      - key: ENABLE_LIVE_RECALLS_API
        value: "true"
